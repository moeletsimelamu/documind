[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "documind"
version = "0.1.0"
description = "Document knowledge assistant: upload, search and ask questions with source references."
requires-python = ">=3.12"
authors = [{ name = "Moeletsi Melamu" }]
# Direct dependencies are pinned exactly. Transitive versions are pinned in constraints.txt.
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.6",
    "pypdf==6.21.2",
    # Lets pypdf open AES-encrypted PDFs, including those "protected" with an empty password.
    "cryptography==50.0.2",
    "httpx2==2.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
    "mypy==2.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "LOG", "G"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
# Evaluation documents: each line is a line of the fictional document, so it is not wrapped.
"tests/eval/dataset.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["documind", "tests"]
