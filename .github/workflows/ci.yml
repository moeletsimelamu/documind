# Continuous integration: every push to main and every pull request is checked on a clean Linux
# machine — lint, types and tests for the backend, formatting, tests and a production build for the
# frontend, and the end-to-end suite against the real backend serving that build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the oldest version pyproject.toml accepts; 3.14 is what development uses.
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/constraints.txt

      - name: Install (pinned by constraints.txt)
        run: python -m pip install -c constraints.txt -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests (no network, no AI provider)
        run: python -m pytest

  frontend:
    name: Frontend · tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (exact versions from package-lock.json)
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: End to end · Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/constraints.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend virtual environment
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -c constraints.txt -e .

      - name: Frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build and run end-to-end tests
        working-directory: frontend
        run: npm run e2e

      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
